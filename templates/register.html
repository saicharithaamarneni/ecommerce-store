<!DOCTYPE html>

<html>

<head>

<title>Register</title>

<style>

body{
background:#f4f4f4;
font-family:Arial;
}

.box{
width:350px;
margin:100px auto;
background:white;
padding:30px;
border-radius:10px;
}

input{
width:100%;
padding:10px;
margin:10px 0;
}

button{
width:100%;
padding:10px;
background:green;
color:white;
border:none;
}

</style>

</head>

<body>

<div class="box">

<h2>Create Account</h2>

<form method="POST">

<input
name="username"
placeholder="Username"
required>

<input
name="email"
type="email"
placeholder="Email"
required>

<input
name="password"
type="password"
placeholder="Password"
required>

<button>
Register
</button>

</form>

</div>

</body>

</html>
