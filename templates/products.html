<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Products</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI';
}

body{

background:
linear-gradient(
135deg,
#eef2ff,
#f8fafc
);

}

.navbar{

display:flex;

justify-content:space-between;

align-items:center;

padding:20px 80px;

background:white;

box-shadow:

0 2px 12px rgba(0,0,0,.08);

}

.logo{

font-size:30px;

font-weight:bold;

color:#4f46e5;

}

.nav-links a{

text-decoration:none;

color:#333;

margin-left:25px;

font-size:18px;

}

.heading{

text-align:center;

margin-top:50px;

}

.heading h1{

font-size:55px;

color:#111827;

}

.heading p{

margin-top:10px;

color:#666;

}

.container{

display:grid;

grid-template-columns:
repeat(
auto-fit,
minmax(280px,1fr)
);

gap:35px;

padding:60px;

}

.card{

background:white;

border-radius:20px;

overflow:hidden;

box-shadow:

0 12px 30px rgba(0,0,0,.08);

transition:.3s;

}

.card:hover{

transform:
translateY(-10px);

}

.card img{

width:100%;

height:260px;

object-fit:cover;

}

.info{

padding:20px;

text-align:center;

}

.info h2{

font-size:28px;

}

.price{

font-size:24px;

margin-top:10px;

color:#4f46e5;

font-weight:bold;

}

.buy{

margin-top:20px;

width:100%;

padding:14px;

border:none;

border-radius:12px;

background:#4f46e5;

color:white;

font-size:18px;

cursor:pointer;

}

.buy:hover{

background:#3526d9;

}

</style>

</head>

<body>

<div class="navbar">

<div class="logo">

SHOPIFY

</div>

<div class="nav-links">

<a href="/dashboard">

Dashboard

</a>

<a href="/cart">

🛒 Cart

</a>

<a href="/logout">

Logout

</a>

</div>

</div>


<div class="heading">

<h1>

🛍 Our Products

</h1>

<p>

Premium Collection Just For You

</p>

</div>


<div class="container">

{% for product in products %}

<div class="card">

<img
src="{{product.image}}"
>

<div class="info">

<h2>

{{product.name}}

</h2>

<div class="price">

₹ {{product.price}}

</div>

<a
href="/add-to-cart/{{product.id}}"
>

<button class="buy">

Add To Cart

</button>

</a>

</div>

</div>

{% endfor %}

</div>

</body>

</html>
