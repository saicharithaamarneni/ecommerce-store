<!DOCTYPE html>

<html>

<head>

<title>Users</title>

<style>

body{
font-family:Arial;
padding:40px;
}

table{
border-collapse:collapse;
width:100%;
}

th,td{
border:1px solid black;
padding:10px;
}

</style>

</head>

<body>

<h2>Registered Users</h2>

<table>

<tr>
<th>ID</th>
<th>Username</th>
<th>Email</th>
</tr>

{% for user in users %}

<tr>

<td>{{ user.id }}</td>

<td>{{ user.username }}</td>

<td>{{ user.email }}</td>

</tr>

{% endfor %}

</table>

</body>

</html>
