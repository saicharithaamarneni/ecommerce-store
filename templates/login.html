<!DOCTYPE html>
<html>

<head>

<title>Login</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
}

.box{

width:350px;

margin:100px auto;

background:white;

padding:35px;

border-radius:12px;

box-shadow:0 0 15px rgba(0,0,0,.1);

}

h2{

text-align:center;

}

input{

width:100%;

padding:12px;

margin:10px 0;

border:1px solid #ddd;

border-radius:8px;

box-sizing:border-box;

}

button{

width:100%;

padding:12px;

background:#007bff;

color:white;

border:none;

border-radius:8px;

font-size:16px;

cursor:pointer;

}

button:hover{

background:#0056b3;

}

a{

text-decoration:none;

}

.register{

text-align:center;

margin-top:15px;

}

</style>

</head>

<body>

<div class="box">

<h2>Login</h2>

<form method="POST">

<input
type="email"
name="email"
placeholder="Enter Email"
required>

<input
type="password"
name="password"
placeholder="Enter Password"
required>

<button type="submit">

Login

</button>

</form>

<div class="register">

<p>

Don't have account?

<a href="/register">

Create account

</a>

</p>

</div>

</div>

</body>

</html>
