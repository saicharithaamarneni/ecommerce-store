<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>My Cart</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI';
}

body{

background:
linear-gradient(
135deg,
#eef2ff,
#f8fafc
);

padding:40px;

}

.navbar{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:50px;

}

.logo{

font-size:30px;

font-weight:bold;

color:#4f46e5;

}

.navbar a{

text-decoration:none;

color:#333;

font-size:18px;

}

.heading{

text-align:center;

margin-bottom:40px;

}

.heading h1{

font-size:50px;

}

.container{

max-width:900px;

margin:auto;

}

.card{

background:white;

border-radius:18px;

padding:25px;

margin-bottom:20px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:

0 10px 25px rgba(0,0,0,.08);

}

.left h2{

margin-bottom:10px;

}

.price{

font-size:22px;

color:#4f46e5;

}

.remove{

padding:10px 18px;

background:#ef4444;

color:white;

border:none;

border-radius:10px;

cursor:pointer;

}

.checkout{

margin-top:30px;

text-align:center;

}

.checkout button{

padding:15px 30px;

background:#4f46e5;

color:white;

border:none;

border-radius:12px;

font-size:20px;

cursor:pointer;

}

.total{

font-size:34px;

margin-top:30px;

text-align:center;

color:#111827;

}

.empty{

text-align:center;

font-size:28px;

margin-top:100px;

color:#666;

}

</style>

</head>

<body>

<div class="navbar">

<div class="logo">

SHOPIFY

</div>

<a href="/products">

Continue Shopping

</a>

</div>


<div class="heading">

<h1>

🛒 My Cart

</h1>

</div>


{% if items %}

<div class="container">

{% for p in items %}

<div class="card">

<div class="left">

<h2>

{{p.name}}

</h2>

<div class="price">

₹ {{p.price}}

</div>

</div>

<a href="/remove/{{p.id}}">

<button class="remove">

Remove

</button>

</a>

</div>

{% endfor %}

</div>


<div class="total">

Total ₹ {{total}}

</div>


<div class="checkout">

<a href="/checkout">

<button>

Checkout

</button>

</a>

</div>

{% else %}

<div class="empty">

Your cart is empty 🛍

</div>

{% endif %}

</body>

</html>
